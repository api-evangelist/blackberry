name: Blackberry
description: >-
  BlackBerry Limited is a Canadian intelligent security software and services
  company headquartered in Waterloo, Ontario, and listed on the NYSE and TSX as
  BB. Once known for its smartphones, BlackBerry today builds embedded and
  cybersecurity software for enterprises and governments. Its portfolio spans
  QNX (a real-time operating system for automotive and embedded/IoT systems),
  Cylance AI-driven endpoint protection, BlackBerry UEM (Unified Endpoint
  Management), BlackBerry AtHoc critical event management and mass notification,
  BlackBerry SecuSUITE secure voice and messaging, BlackBerry Workspaces secure
  file sharing, and the BlackBerry Dynamics secure mobility platform. Developers
  integrate with these products through REST APIs and SDKs, including the
  BlackBerry UEM Web Services REST API, the BlackBerry AtHoc API (v2, REST with
  OpenID Connect / OAuth 2 auth), and the BlackBerry Dynamics SDKs for iOS,
  Android, Cordova, and React Native. This profile was added to the API
  Evangelist network as a portfolio-company lead and enriched by the pipeline
  from BlackBerry's public developer surface.
